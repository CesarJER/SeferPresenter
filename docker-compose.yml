services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefer-presenter-app
    restart: unless-stopped
    environment:
      - SEFER_REQUIRE_AUTH=${SEFER_REQUIRE_AUTH:-false}
      - SEFER_CONTROL_PASSWORD=${SEFER_CONTROL_PASSWORD:-}
      - SEFER_LIVE_AUDIO_ENABLED=${SEFER_LIVE_AUDIO_ENABLED:-false}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - SEFER_LIVE_AUDIO_PUBLIC_LISTEN=${SEFER_LIVE_AUDIO_PUBLIC_LISTEN:-true}
    volumes:
      - ${DATA_DIR:-.}/presentations.json:/app/presentations.json
      - ${DATA_DIR:-.}/audio_sync.json:/app/audio_sync.json
      - ${DATA_DIR:-.}/public/audio:/app/public/audio
      - ${DATA_DIR:-.}/public/backgrounds:/app/public/backgrounds
      - ${DATA_DIR:-.}/public/videos:/app/public/videos
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    container_name: sefer-presenter-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Required for HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - livekit

  redis:
    image: redis:7-alpine
    container_name: sefer-presenter-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    mem_limit: 512m

  livekit:
    image: livekit/livekit-server:latest
    container_name: sefer-presenter-livekit
    restart: unless-stopped
    entrypoint: /bin/sh -c "export NODE_IP=$$(wget -qO- http://api.ipify.org || wget -qO- http://icanhazip.com || wget -qO- http://ifconfig.me/ip) && exec /livekit-server"
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      - "REDIS_HOST=redis:6379"
      - "UDP_PORT=50000-50050"
    ports:
      - "7880:7880/tcp"
      - "50000-50050:50000-50050/udp"
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "8"
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7880/alive" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  caddy_data:
  caddy_config:
