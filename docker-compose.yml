x-logging: &bounded-logging
  # Docker's local driver rotates by size and uses an efficient compressed
  # format. Time retention is enforced by scripts/rotate-docker-logs.ps1.
  driver: local
  options:
    max-size: "5m"
    max-file: "3"
    compress: "true"

x-no-logging: &no-logging
  driver: none

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SEFER_LIVE_AUDIO_BUILD: ${VITE_SEFER_LIVE_AUDIO_BUILD:-false}
        VITE_SEFER_ACTIVE_ALIAS_VISIBLE_BY_DEFAULT: ${VITE_SEFER_ACTIVE_ALIAS_VISIBLE_BY_DEFAULT:-false}
        VITE_AUTODUCK_ROLES: ${VITE_AUTODUCK_ROLES:-control,audience}
        VITE_ORGANIZATION_NAME: ${VITE_ORGANIZATION_NAME:-}
        VITE_ORGANIZATION_LEGAL_ID: ${VITE_ORGANIZATION_LEGAL_ID:-}
        VITE_ORGANIZATION_EMAIL: ${VITE_ORGANIZATION_EMAIL:-}
        VITE_ORGANIZATION_WEBSITE: ${VITE_ORGANIZATION_WEBSITE:-}
        VITE_PRIVACY_POLICY_PATH: ${VITE_PRIVACY_POLICY_PATH:-/legal/privacy.md}
        VITE_PRIVACY_SUMMARY_PATH: ${VITE_PRIVACY_SUMMARY_PATH:-/legal/privacy-summary.md}
        VITE_SEFER_AUDIENCE_STORAGE_TTL_HOURS: ${VITE_SEFER_AUDIENCE_STORAGE_TTL_HOURS:-24}
        VITE_SEFER_PUBLICABLE_PERMISSION: ${VITE_SEFER_PUBLICABLE_PERMISSION:-RECORDING}
        VITE_SEFER_PUBLICABLE_DEFAULT: ${VITE_SEFER_PUBLICABLE_DEFAULT:-off}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      - SEFER_REQUIRE_AUTH=${SEFER_REQUIRE_AUTH:-true}
      - SEFER_CONTROL_PASSWORD=${SEFER_CONTROL_PASSWORD:-}
      - SEFER_ALLOWED_ORIGINS=${SEFER_ALLOWED_ORIGINS:-}
      - SEFER_SESSION_ACCESS_DEFAULT=${SEFER_SESSION_ACCESS_DEFAULT:-PUBLIC}
      - SEFER_LIVE_AUDIO_ENABLED=${SEFER_LIVE_AUDIO_ENABLED:-false}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_ROOM_NAME=${LIVEKIT_ROOM_NAME:-sefer-live-audio}
      - SEFER_LIVE_AUDIO_PUBLIC_LISTEN=${SEFER_LIVE_AUDIO_PUBLIC_LISTEN:-true}
      - SEFER_LIVE_AUDIO_TOKEN_TTL_MINUTES=${SEFER_LIVE_AUDIO_TOKEN_TTL_MINUTES:-30}
      - SEFER_LIVE_AUDIO_REJOIN_GRACE_SECONDS=${SEFER_LIVE_AUDIO_REJOIN_GRACE_SECONDS:-60}
      - SEFER_LIVE_AUDIO_ALLOW_DELEGATED_MODERATORS=${SEFER_LIVE_AUDIO_ALLOW_DELEGATED_MODERATORS:-true}
      - SEFER_LIVE_AUDIO_CONTROL_CODE_TTL_SECONDS=${SEFER_LIVE_AUDIO_CONTROL_CODE_TTL_SECONDS:-90}
      - SEFER_ACTIVE_ALIAS_MODERATION_DEFAULT_VISIBLE=${SEFER_ACTIVE_ALIAS_MODERATION_DEFAULT_VISIBLE:-true}
      - SEFER_PUBLIC_CATALOGS_JSON=${SEFER_PUBLIC_CATALOGS_JSON:-}
      - SEFER_PRIVACY_MANIFEST_DIR=/app/privacy-manifests
      - SEFER_PRIVACY_POLICY_PATH=${VITE_PRIVACY_POLICY_PATH:-/legal/privacy.md}
      - SEFER_EXTERNAL_BROADCAST_CHANNELS=${SEFER_EXTERNAL_BROADCAST_CHANNELS:-}
      - SEFER_DEPLOYMENT_VERSION=${SEFER_DEPLOYMENT_VERSION:-unversioned}
      - SEFER_BROADCAST_NOTICE_VERSION=${SEFER_BROADCAST_NOTICE_VERSION:-broadcast-notice-v1}
      - SEFER_BACKUP_DIR=/app/backups
      - SEFER_FORCE_IN_PLACE_PERSISTENCE=${SEFER_FORCE_IN_PLACE_PERSISTENCE:-false}
      - VITE_SEFER_PUBLICABLE_PERMISSION=${VITE_SEFER_PUBLICABLE_PERMISSION:-RECORDING}
      - VITE_SEFER_PUBLICABLE_DEFAULT=${VITE_SEFER_PUBLICABLE_DEFAULT:-off}
    volumes:
      - ${DATA_DIR:-.}/presentations.json:/app/presentations.json
      - ${DATA_DIR:-.}/audio_sync.json:/app/audio_sync.json
      - ${DATA_DIR:-.}/public/audio:/app/public/audio:ro
      - ${DATA_DIR:-.}/public/backgrounds:/app/public/backgrounds:ro
      - ${DATA_DIR:-.}/public/videos:/app/public/videos:ro
      - ${SEFER_PRIVACY_LOCAL_PATH:-./privacy-audit.local}/session-manifests.local:/app/privacy-manifests
      - sefer_backups:/app/backups
    expose:
      - "8787"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/livekit/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Application logs use a strict field allowlist and bounded local storage.
    logging: *bounded-logging

  caddy:
    # Local audit pin: Caddy v2.11.4.
    image: caddy@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Required for HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
        restart: true
    # Proxy/runtime errors can contain peer IP addresses. Health checks remain
    # available, but Docker does not persist Caddy process output.
    logging: *no-logging

  redis:
    # Local audit pin: Redis 7.4.9.
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    profiles: [ "live-audio" ]
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    mem_limit: 512m
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Redis startup/runtime output can include network endpoints.
    logging: *no-logging

  livekit:
    # Local audit pin: LiveKit v1.13.1.
    image: livekit/livekit-server@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    profiles: [ "live-audio" ]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -n "$${LIVEKIT_API_KEY}" || { echo "LIVEKIT_API_KEY is required" >&2; exit 1; }
        test -n "$${LIVEKIT_API_SECRET}" || { echo "LIVEKIT_API_SECRET is required" >&2; exit 1; }
        export LIVEKIT_KEYS="$${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}"
        export NODE_IP="$${LIVEKIT_NODE_IP}"
        is_ipv4() {
          printf '%s\n' "$$1" | awk -F. '
            NF != 4 { exit 1 }
            {
              for (i = 1; i <= 4; i++) {
                if ($$i !~ /^[0-9]+$$/ || $$i < 0 || $$i > 255) exit 1
              }
            }
          '
        }
        if [ -z "$$NODE_IP" ]; then
          test "$${LIVEKIT_NODE_IP_AUTO_DETECT}" = "true" || {
            echo "LIVEKIT_NODE_IP is required unless LIVEKIT_NODE_IP_AUTO_DETECT=true" >&2
            exit 1
          }
          echo "LIVEKIT_NODE_IP not set, using explicit HTTPS auto-detection for the server IP..."
          for endpoint in https://api.ipify.org https://icanhazip.com; do
            candidate=$$(wget -qO- -T 5 "$$endpoint" 2>/dev/null | tr -d '\r\n ' || true)
            if is_ipv4 "$$candidate"; then
              NODE_IP="$$candidate"
              break
            fi
          done
        fi
        is_ipv4 "$$NODE_IP" || { echo "LIVEKIT_NODE_IP is not a valid IPv4 address" >&2; exit 1; }
        export NODE_IP
        exec /livekit-server
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP:-}
      - LIVEKIT_NODE_IP_AUTO_DETECT=${LIVEKIT_NODE_IP_AUTO_DETECT:-false}
      - LIVEKIT_LOGGING_LEVEL=${LIVEKIT_LOGGING_LEVEL:-warn}
      - "REDIS_HOST=redis:6379"
      - "UDP_PORT=50000-50050"
    ports:
      - "50000-50050:50000-50050/udp"
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "8"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # LiveKit may emit ICE addresses and token-shaped values. Discard process
    # logs at the Docker boundary instead of attempting fragile redaction.
    logging: *no-logging

volumes:
  caddy_data:
  caddy_config:
  sefer_backups:
